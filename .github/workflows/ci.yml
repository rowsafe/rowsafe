name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: vet, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -yq shellcheck
      - run: make lint
      - run: make test
      - run: make build
      - run: make test-cli-installer
      - run: make test-npm
  macos:
    name: CLI on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./cmd/rowsafe/... ./mcp/... ./client/... ./preview/... ./protocol/...
      - run: make build
      - name: Install the CLI as a user would (fake release, then the real latest one)
        run: sh scripts/test-cli.sh --real
      - name: npm wrapper (fake release)
        run: make test-npm
  windows:
    name: CLI on Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./cmd/rowsafe/... ./mcp/... ./client/... ./preview/... ./protocol/... ./local/... ./pulse/... ./internal/maintenance/... ./internal/indexadvisor/...
      - name: Build rowsafe.exe and run it
        shell: bash
        run: |
          go build -o rowsafe.exe ./cmd/rowsafe
          ./rowsafe.exe version
          ./rowsafe.exe help local
      - name: Fixes without an account, on the runner's PostgreSQL
        shell: pwsh
        run: |
          Set-Service -InputObject (Get-Service -Name postgresql*) -Status running -StartupType manual
          & "$env:PGBIN\pg_isready" -h localhost -t 60
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Load pg_stat_statements first, so tune has no restart-only library to add:
          # the runner is the database server here, which Rowsafe doesn't support on Windows.
          & "$env:PGBIN\psql" -h localhost -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Restart-Service -InputObject (Get-Service -Name postgresql*)
          & "$env:PGBIN\pg_isready" -h localhost -t 60
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # A table with dead rows that autovacuum won't clean: Pulse's "Clean up 1 table".
          & "$env:PGBIN\psql" -h localhost -v ON_ERROR_STOP=1 -c "CREATE TABLE t (id int, v text) WITH (autovacuum_enabled = false); INSERT INTO t SELECT g, repeat('x', 100) FROM generate_series(1, 200000) g; DELETE FROM t WHERE id % 10 <> 0; SELECT pg_stat_force_next_flush();"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $db = "postgresql://postgres:$($env:PGPASSWORD)@localhost:5432/postgres?sslmode=disable"
          ./rowsafe.exe fix $db vacuum_behind --yes
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./rowsafe.exe tune $db --memory 4GB --cpus 2 --yes
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: npm wrapper (fake release)
        run: node --test integrations/npm/test/wrapper.test.js
  reproducible:
    name: reproducible build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build twice in different directories and compare
        run: |
          make dist VERSION=0.0.0 RELEASE_PUBLIC_KEY=ci-check >/dev/null
          (cd dist/0.0.0 && sha256sum -- * | sort) > "$RUNNER_TEMP/a"
          cp -R . "$RUNNER_TEMP/copy" && cd "$RUNNER_TEMP/copy" && rm -rf dist && go clean -cache
          make dist VERSION=0.0.0 RELEASE_PUBLIC_KEY=ci-check >/dev/null
          (cd dist/0.0.0 && sha256sum -- * | sort) > "$RUNNER_TEMP/b"
          diff -u "$RUNNER_TEMP/a" "$RUNNER_TEMP/b" && echo "binaries are byte-identical"
  image:
    name: agent image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Docker agent image (PostgreSQL 17, amd64)
        run: docker build -f deploy/docker/agent.Dockerfile --build-arg PG_MAJOR=17 --build-arg VERSION=0.0.0 -t rowsafe-agent-ci .
      - name: Build the ClickHouse agent image (26.8, amd64)
        run: docker build -f deploy/docker/agent-clickhouse.Dockerfile --build-arg CH_VERSION=26.8 --build-arg VERSION=0.0.0 -t rowsafe-agent-clickhouse-ci .
