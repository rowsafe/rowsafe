# OpenSSF Scorecard: an automated, public security assessment of this
# repository (branch protection, pinned dependencies, signed releases, ...).
# Results: https://securityscorecards.dev/viewer/?uri=github.com/rowsafe/rowsafe
name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          sarif_file: results.sarif
