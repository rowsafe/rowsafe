# Builds, signs, attests and publishes an agent/CLI release when a
# vMAJOR.MINOR.PATCH tag is pushed. See docs/verifying-releases.md.
#
# Every release carries three independent proofs:
#   1. manifest.json.sig   Ed25519 signature the agent checks before it runs an
#                          update (key compiled into the agent; offline).
#   2. SLSA provenance     Sigstore-signed, keyless attestation that GitHub
#                          Actions built each file from this repository at this
#                          tag, recorded in the public Rekor transparency log.
#   3. SBOM                SPDX list of every dependency, also attested.
# The build is reproducible; a second job rebuilds on a fresh runner and
# requires byte-identical binaries.
#
# It never offers the release to agents: `rowsafed release add` on the control
# plane stays a deliberate, manual step.
#
# "release" environment (Settings > Environments, with required reviewers):
#   secret   ROWSAFE_RELEASE_PRIVATE_KEY          base64 Ed25519 private key
#   secret   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY  token scoped to the releases bucket
#   variable ROWSAFE_RELEASE_PUBLIC_KEY           the matching public key
#   variable R2_ENDPOINT                          https://<account-id>.r2.cloudflarestorage.com
#   variable R2_RELEASES_BUCKET                   bucket served at https://releases.rowsafe.sh

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write       # GitHub release
      id-token: write       # Sigstore keyless signing
      attestations: write   # build provenance and SBOM attestations
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      BUCKET: ${{ vars.R2_RELEASES_BUCKET }}
      RELEASE_PUBLIC_KEY: ${{ vars.ROWSAFE_RELEASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          if ! printf '%s\n' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          echo "VERSION=$v" >>"$GITHUB_ENV"

      - name: Refuse to overwrite a published release
        if: env.R2_ENDPOINT != ''
        run: |
          if aws s3api head-object --endpoint-url "$R2_ENDPOINT" --bucket "$BUCKET" \
              --key "agent/$VERSION/manifest.json" >/dev/null 2>&1; then
            echo "::error::release $VERSION is already published; releases are immutable, tag a new version"; exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build and sign (Ed25519 manifest)
        env:
          ROWSAFE_RELEASE_PRIVATE_KEY: ${{ secrets.ROWSAFE_RELEASE_PRIVATE_KEY }}
        run: make release VERSION="$VERSION" RELEASE_PUBLIC_KEY="$RELEASE_PUBLIC_KEY"

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/${{ env.VERSION }}/rowsafe-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance (SLSA, Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ env.VERSION }}/rowsafe-agent-linux-*
            dist/${{ env.VERSION }}/rowsafe-linux-*
            dist/${{ env.VERSION }}/rowsafe-darwin-*
            dist/${{ env.VERSION }}/rowsafe-release-*
            dist/${{ env.VERSION }}/install.sh
            dist/${{ env.VERSION }}/manifest.json
            dist/${{ env.VERSION }}/SHA256SUMS

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/${{ env.VERSION }}/rowsafe-agent-linux-*
            dist/${{ env.VERSION }}/rowsafe-linux-*
            dist/${{ env.VERSION }}/rowsafe-darwin-*
          sbom-path: dist/${{ env.VERSION }}/rowsafe-${{ env.VERSION }}.spdx.json

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/"$VERSION"/* \
            --verify-tag --title "Rowsafe $VERSION" --generate-notes \
            --notes "Verify this release: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/verifying-releases.md"

      # R2 credentials are optional: without them the signed, attested files
      # are published on the GitHub release only, and copied to
      # releases.rowsafe.sh by a maintainer.
      - name: Upload to R2
        if: env.R2_ENDPOINT != ''
        run: |
          aws s3 cp "dist/$VERSION/" "s3://$BUCKET/agent/$VERSION/" --recursive \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors

      - name: Verify the published release with its own installer
        if: env.R2_ENDPOINT != ''
        run: ROWSAFE_VERSION="$VERSION" sh "dist/$VERSION/install.sh" --download-only "$RUNNER_TEMP/verify"

      - name: Next steps
        run: |
          {
            echo "## Release $VERSION published"
            echo
            echo "Signed, attested and uploaded to https://releases.rowsafe.sh/agent/$VERSION/. Agents are **not** offered it yet."
            echo
            echo '```sh'
            echo "curl -fsSLO https://releases.rowsafe.sh/agent/$VERSION/manifest.json"
            echo "curl -fsSLO https://releases.rowsafe.sh/agent/$VERSION/manifest.json.sig"
            echo "rowsafed release add --manifest manifest.json --signature manifest.json.sig --channel stable --rollout 10"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # Rebuild from the tag on a fresh runner and require byte-identical binaries.
  reproducible:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Rebuild and compare with the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLIC_KEY: ${{ vars.ROWSAFE_RELEASE_PUBLIC_KEY }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          make dist VERSION="$v" RELEASE_PUBLIC_KEY="$RELEASE_PUBLIC_KEY"
          mkdir published && gh release download "$GITHUB_REF_NAME" -D published -p 'rowsafe-*' -R "$GITHUB_REPOSITORY"
          fail=0
          for f in dist/"$v"/rowsafe-*; do
            b=$(basename "$f")
            if cmp -s "$f" "published/$b"; then echo "identical  $b"; else echo "DIFFERENT  $b"; fail=1; fi
          done
          exit $fail

  # Docker sidecar images, signed with cosign (keyless) and attested.
  image:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        pg: ["14", "15", "16", "17", "18"]
        flavor:
          - { suffix: "", uid: "999", gid: "999" }       # postgres:NN (Debian)
          - { suffix: "-alpine", uid: "70", gid: "70" }  # postgres:NN-alpine
    env:
      IMAGE: ghcr.io/rowsafe/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >>"$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/agent.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.VERSION }}
            PG_MAJOR=${{ matrix.pg }}
            PG_UID=${{ matrix.flavor.uid }}
            PG_GID=${{ matrix.flavor.gid }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-pg${{ matrix.pg }}${{ matrix.flavor.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
          push: true
      - name: Sign the image (cosign, keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
