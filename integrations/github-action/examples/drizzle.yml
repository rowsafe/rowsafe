# Drizzle: save a Mark, preview the new SQL migrations on a copy, then migrate.
# Secrets: ROWSAFE_API_KEY (a read-write Rowsafe API key), DATABASE_URL.
name: deploy
on:
  push:
    branches: [main]
concurrency: deploy-production
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lets the preview find the migrations this push adds
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Save a Mark before the migration
        uses: rowsafe/action@v1
        with:
          api-key: ${{ secrets.ROWSAFE_API_KEY }}
          database: app
          preview-sql: drizzle/*.sql # the "out" folder in drizzle.config.ts

      - run: npx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # ... then deploy the application as usual
