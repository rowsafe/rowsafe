# Rails: save a Mark, then run the migrations and deploy.
# Secrets: ROWSAFE_API_KEY (a read-write Rowsafe API key), DATABASE_URL, RAILS_MASTER_KEY.
name: deploy
on:
  push:
    branches: [main]
concurrency: deploy-production
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Save a Mark before the migration
        uses: rowsafe/action@v1
        with:
          api-key: ${{ secrets.ROWSAFE_API_KEY }}
          database: app
          require-protected: true # don't migrate a database that can't be restored

      - run: bin/rails db:migrate
        env:
          RAILS_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      # ... then deploy (Kamal, Capistrano, ...)
