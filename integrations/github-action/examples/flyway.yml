# Flyway: save a Mark, preview the new versioned migrations on a copy, then migrate.
# Secrets: ROWSAFE_API_KEY (a read-write Rowsafe API key), FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD.
name: deploy
on:
  push:
    branches: [main]
concurrency: deploy-production
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lets the preview find the migrations this push adds

      - name: Save a Mark before the migration
        uses: rowsafe/action@v1
        with:
          api-key: ${{ secrets.ROWSAFE_API_KEY }}
          database: app
          preview-sql: sql/V*__*.sql
          fail-on: dangerous # stop before migrations that would lock big tables

      - name: flyway migrate
        run: >-
          docker run --rm -v "$PWD/sql:/flyway/sql"
          -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD
          redgate/flyway:11 migrate
        env:
          FLYWAY_URL: ${{ secrets.FLYWAY_URL }}
          FLYWAY_USER: ${{ secrets.FLYWAY_USER }}
          FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}
